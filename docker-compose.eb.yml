services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.eb
    environment:
      APP_ENV: production
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.eb
    ports:
      - "80:80"
    depends_on:
      - app

  redis:
    image: redis:7-alpine

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.eb
    command: php artisan horizon
    environment:
      APP_ENV: production
    depends_on:
      - redis
      - app